name: Upstream

concurrency:
  group: upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      oxc_version:
        description: "oxc version to bump to (e.g. 0.149.0). Leave blank to auto-detect the latest release on crates.io."
        required: false
        type: string
      gem_version:
        description: "Gem version to release. Leave blank to match the oxc version. Use a fourth digit (e.g. 0.149.0.1) to re-release the same oxc version."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    name: Detect and PR a new oxc release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Determine oxc version
        id: upstream
        env:
          INPUT_VERSION: ${{ inputs.oxc_version }}
          INPUT_GEM_VERSION: ${{ inputs.gem_version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION}" ]]; then
            upstream_version="${INPUT_VERSION#v}"
          else
            upstream_version=$(curl -sSf https://crates.io/api/v1/crates/oxc \
              -H "User-Agent: oxc-ruby upstream workflow" | jq -r '.crate.max_stable_version')
          fi

          if ! curl -sSf "https://crates.io/api/v1/crates/oxc/${upstream_version}" \
            -H "User-Agent: oxc-ruby upstream workflow" > /dev/null; then
            echo "::error::oxc ${upstream_version} is not published on crates.io"
            exit 1
          fi

          gem_version="${INPUT_GEM_VERSION:-${upstream_version}}"

          if [[ ! "${gem_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::gem version ${gem_version} is not of the form X.Y.Z or X.Y.Z.N"
            exit 1
          fi

          current_version=$(grep -E '^oxc = \{ version = "=' rust/Cargo.toml | sed -E 's/.*version = "=([^"]+)".*/\1/')
          current_gem_version=$(sed -n -E 's/^  VERSION = "(.*)"$/\1/p' lib/oxc/version.rb)

          echo "upstream_version=${upstream_version}" >> "$GITHUB_OUTPUT"
          echo "current_version=${current_version}" >> "$GITHUB_OUTPUT"
          echo "gem_version=${gem_version}" >> "$GITHUB_OUTPUT"
          echo "current_gem_version=${current_gem_version}" >> "$GITHUB_OUTPUT"

          if [[ "${upstream_version}" == "${current_version}" && "${gem_version}" == "${current_gem_version}" ]]; then
            echo "Already up to date (oxc ${current_version}, gem ${current_gem_version})"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release: oxc ${current_version} -> ${upstream_version}, gem ${current_gem_version} -> ${gem_version}"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing PR
        if: steps.upstream.outputs.needed == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GEM_VERSION: ${{ steps.upstream.outputs.gem_version }}
        run: |
          set -euo pipefail

          pr=$(gh pr list --head "bot-dep-oxc-${GEM_VERSION}" --json number --jq '.[0].number // empty')

          if [[ -n "${pr}" ]]; then
            echo "PR #${pr} already exists for ${GEM_VERSION}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Set up Ruby
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Bump oxc and the gem version
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          GEM_VERSION: ${{ steps.upstream.outputs.gem_version }}
        run: |
          set -euo pipefail

          sed -E -i "s|^(oxc = \{ version = \"=)[^\"]*(\")|\1${UPSTREAM_VERSION}\2|" rust/Cargo.toml
          sed -E -i "s|^  VERSION = \".*\"|  VERSION = \"${GEM_VERSION}\"|" lib/oxc/version.rb

          sed -E -i "s|assert_equal \".*\", Oxc::VERSION|assert_equal \"${GEM_VERSION}\", Oxc::VERSION|" test/oxc_test.rb
          sed -E -i "s|assert_equal \".*\", Oxc\.oxc_version|assert_equal \"${UPSTREAM_VERSION}\", Oxc.oxc_version|" test/oxc_test.rb

          git diff --stat

      - name: Update the lockfiles
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
        run: |
          set -euo pipefail

          cargo fetch --manifest-path rust/Cargo.toml

          bundle config set --local deployment false
          bundle config set --local frozen false
          bundle install

          locked=$(sed -n -E '/^name = "oxc"$/{n;s/^version = "(.*)"$/\1/p;}' rust/Cargo.lock)

          if [[ "${locked}" != "${UPSTREAM_VERSION}" ]]; then
            echo "::error::rust/Cargo.lock pins oxc ${locked}, expected ${UPSTREAM_VERSION}"
            exit 1
          fi

      - name: Build and test against the new version
        id: verify
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false'
        continue-on-error: true
        run: |
          set -o pipefail

          bundle exec rake test 2>&1 | tee "${RUNNER_TEMP}/verify.log"

      - name: Create pull request
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.OXC_RUBY_PR_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_VERSION: ${{ steps.upstream.outputs.current_version }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.upstream_version }}
          CURRENT_GEM_VERSION: ${{ steps.upstream.outputs.current_gem_version }}
          GEM_VERSION: ${{ steps.upstream.outputs.gem_version }}
          VERIFIED: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail

          branch="bot-dep-oxc-${GEM_VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git switch -c "${branch}"
          git add rust/Cargo.toml rust/Cargo.lock lib/oxc/version.rb test/oxc_test.rb Gemfile.lock
          git commit -m "$(printf "Bump oxc to %s\n\nUpdate the embedded oxc dependency from %s to %s and release it as\ngem v%s.\n\nhttps://github.com/oxc-project/oxc/releases/tag/crates_v%s" \
            "${UPSTREAM_VERSION}" "${CURRENT_VERSION}" "${UPSTREAM_VERSION}" "${GEM_VERSION}" "${UPSTREAM_VERSION}")"

          git push --force -u origin "${branch}"

          body="${RUNNER_TEMP}/pr-body.md"

          {
            printf 'Update the embedded oxc dependency from %s to [%s](https://github.com/oxc-project/oxc/releases/tag/crates_v%s).\n\n' \
              "${CURRENT_VERSION}" "${UPSTREAM_VERSION}" "${UPSTREAM_VERSION}"
            printf 'The gem version tracks the oxc version it packages, so this also bumps the gem from %s to **%s**.\n\n' \
              "${CURRENT_GEM_VERSION}" "${GEM_VERSION}"
          } > "${body}"

          if [[ "${VERIFIED}" == "success" ]]; then
            printf 'The gem was built and tested against the new version before this PR was opened. Merging this does not publish anything, cut a `v%s` release to push the gems.\n' \
              "${GEM_VERSION}" >> "${body}"
          else
            {
              printf '> [!WARNING]\n'
              printf '> The gem did not build or test cleanly against this version, so this PR is a draft.\n'
              printf '> Something upstream changed in a way this gem has to be adapted to.\n\n'
              printf '<details><summary>Verification output</summary>\n\n```\n'
              sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' "${RUNNER_TEMP}/verify.log" | tail -c 8000
              printf '\n```\n\n</details>\n'
            } >> "${body}"
          fi

          printf '\nThis PR was created automatically by the upstream workflow.\n' >> "${body}"

          if [[ "${VERIFIED}" == "success" ]]; then
            gh pr create --title "Bump oxc to ${UPSTREAM_VERSION}" --body-file "${body}"
          else
            gh pr create --draft --title "Bump oxc to ${UPSTREAM_VERSION}" --body-file "${body}"
          fi

      - name: Report the verification result
        if: steps.upstream.outputs.needed == 'true' && steps.existing_pr.outputs.exists == 'false' && steps.verify.outcome == 'failure'
        run: |
          echo "::error::The gem did not build or test cleanly against the new version. A draft PR was opened to fix it in."
          exit 1
